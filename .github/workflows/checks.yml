name: Checks

# Reusable workflow. Runs the full matrix of typecheck + lint + test + build
# verification. Called by ci.yml (push / PR) and release.yml (v* tag gate).
# Secrets are inherited by the caller via `secrets: inherit` — missing values
# (e.g. PR from a fork) fall through to source defaults.

on:
  workflow_call:

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate client from OpenAPI spec
        run: npm run codegen
        env:
          POLYLANE_API_DOMAIN: ${{ secrets.POLYLANE_API_DOMAIN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          POLYLANE_API_DOMAIN: ${{ secrets.POLYLANE_API_DOMAIN }}
          POLYLANE_OAUTH_CLIENT_ID: ${{ secrets.POLYLANE_OAUTH_CLIENT_ID }}
          POLYLANE_OAUTH_CLIENT_SECRET: ${{ secrets.POLYLANE_OAUTH_CLIENT_SECRET }}

      - name: Verify build output
        run: |
          test -f dist/polylane.mjs
          test -x dist/polylane.mjs
          ./dist/polylane.mjs --version
          ./dist/polylane.mjs --help | head -5
