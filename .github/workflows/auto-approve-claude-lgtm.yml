# Auto-approves a PR when Claude's review bot posts an LGTM verdict.
#
# Claude's bot sessions cannot submit APPROVE reviews (GitHub rejects
# self/app approvals for that integration), so Claude posts a COMMENT
# review whose body carries an "LGTM:" verdict per REVIEW.md. This
# workflow turns that signal into a real approval from
# github-actions[bot].
#
# Inert until a repo admin enables "Allow GitHub Actions to create and
# approve pull requests" under Settings -> Actions -> General; without
# that setting the approval POST fails with 422.
#
# Guards:
#   * Only fires for reviews authored by claude[bot], matched by both
#     login and immutable numeric user id, in state "commented", whose
#     body starts with the exact verdict token "LGTM:" (the contract in
#     REVIEW.md; a mention elsewhere in the body never fires).
#   * Skips if the review is pinned to a commit that is no longer the
#     PR head (a push landed after Claude reviewed).
#   * The approval itself is pinned to the reviewed commit via
#     commit_id, so it cannot silently attach to a newer head.
#
# Known residual risk: pull_request_review runs this workflow from the
# PR's merge ref, so a PR that edits this file runs its edited copy.
# Branch protection ("Dismiss stale approvals" + required human review)
# is the real backstop.
name: Auto-approve Claude LGTM

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  approve:
    runs-on: ubuntu-latest
    if: >-
      github.event.review.user.login == 'claude[bot]' &&
      github.event.review.user.id == 209825114 &&
      github.event.review.state == 'commented' &&
      startsWith(github.event.review.body, 'LGTM:')
    permissions:
      pull-requests: write
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$REVIEW_COMMIT" != "$HEAD_SHA" ]; then
            echo "Review is pinned to $REVIEW_COMMIT but PR head is $HEAD_SHA; stale review, skipping."
            exit 0
          fi
          body=$'Auto-approved: Claude reviewed this PR and posted an LGTM verdict (see its review). A repo admin enabled this via the auto-approve workflow.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh api "repos/$GH_REPO/pulls/$PR/reviews" \
            -f event=APPROVE \
            -f commit_id="$REVIEW_COMMIT" \
            -f body="$body"
